<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proof Before Pay · smart display simulator</title>
  <link rel="stylesheet" href="/host.css">
</head>
<body>
  <!-- 1280x800 smart display frame (Alexa+ experience simulated in our web host; no LLM). -->
  <div id="device" data-device-class="echo-show-8">
    <div id="screen">
      <div id="topbar">
        <span id="addon-name">Proof Before Pay</span>
        <span id="clock-wrap"><span id="clock">--</span> <span id="sim-badge" data-advanced="0">simulated time</span></span>
      </div>
      <div id="main">
        <div id="card" aria-live="polite"></div>
        <aside id="chips" aria-label="MCP tool calls"></aside>
      </div>
      <div id="subtitles">
        <p id="sub-user"></p>
        <p id="sub-alexa"></p>
        <span id="sub-seconds"></span>
      </div>
    </div>
  </div>

  <div id="controls">
    <form id="say">
      <input id="utterance" autocomplete="off" placeholder='Say something, e.g. "I need a licensed electrician to replace outlets in the master bath"'>
      <button type="submit" id="send">Send</button>
      <button type="button" id="mic" title="Speak (Web Speech, if the browser has it)" disabled>Mic</button>
    </form>
    <div id="buttons">
      <button type="button" id="play-demo">Play demo</button>
      <button type="button" id="sim-time">Simulated time → Thu 2:15 PM</button>
      <button type="button" id="new-session">New session</button>
      <button type="button" id="reset-demo">Reset demo</button>
    </div>
    <div id="session-info">user <code id="user">-</code> · protocol <code id="protocol">connecting…</code> · session <code id="session">-</code> · tools <code id="tools">-</code></div>
    <ol id="transcript"></ol>
  </div>
  <script src="/config.js"></script>
  <script type="module" src="/host.js"></script>
</body>
</html>
